name: Experiment 6 Web Prototype Tests

on:
  pull_request:
    paths:
      - 'docs/engineering-discovery-chat/**'
      - 'experiments/engineering-discovery-chat/tests/**'
  push:
    branches: [main]
    paths:
      - 'docs/engineering-discovery-chat/**'
      - 'experiments/engineering-discovery-chat/tests/**'

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic engine tests
        run: node --test experiments/engineering-discovery-chat/tests/engine.test.mjs
